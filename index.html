    // ===== SPEECH =====
    function speak(text) {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN'; u.rate = 0.8;
        speechSynthesis.speak(u);
    }
    function speakWord() { speak(vocabList[currentCard].hanzi); }

    // ===== AUDIO FEEDBACK =====
    function playSound(correct) {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = correct ? 600 : 200;
        osc.type = correct ? 'sine' : 'square';
        gain.gain.value = 0.3;
        osc.start(); osc.stop(ctx.currentTime + 0.2);
    }

    // ===== TOAST =====
    function showToast(msg, success) {
        const t = document.createElement('div');
        t.className = 'toast ' + (success ? 'toast-success' : 'toast-error');
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2000);
    }

            const c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.width = c.style.height = (Math.random() * 10 + 5) + 'px';
            c.style.background = colors[Math.floor(Math.random() * colors.length)];
            c.style.animationDelay = Math.random() * 2 + 's';
            c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 5000);
        }
    }

        document.getElementById('card-counter').textContent = `${currentCard + 1}/${vocabList.length}`;

    }

        const w = vocabList[currentCard].hanzi;
        if (learnedWords.includes(w)) learnedWords = learnedWords.filter(x => x !== w);
        else learnedWords.push(w);
        localStorage.setItem('learned', JSON.stringify(learnedWords));
        showToast(learnedWords.includes(w) ? '⭐ Đã đánh dấu!' : 'Đã bỏ đánh dấu', true);
    }
    function toggleLearnedFilter() {
        showOnlyLearned = !showOnlyLearned;
        vocabList = showOnlyLearned ? VOCAB.filter(v => learnedWords.includes(v.hanzi)) : [...VOCAB];
        if (vocabList.length === 0) { vocabList = [...VOCAB]; showOnlyLearned = false; showToast('Chưa có từ nào được đánh dấu', false); }

    function renderGrammarExercises(exercises, gi) {
        return exercises.map((ex, ei) => {
            const id = `gex-${gi}-${ei}`;
            if (ex.type === 'fill' || ex.type === 'choice') {
                return `<div class="mb-3 p-3 rounded-lg" style="background:var(--bg);"><p class="mb-2 font-medium">${ex.q}</p>

    function highlightText(text) {
        const vocabWords = VOCAB.map(v => v.hanzi);
        const grammarPatterns = ['越来越', '除了', '以外', '还'];
        let result = text;
        grammarPatterns.forEach(p => { result = result.replace(new RegExp(p, 'g'), `<span class="highlight-grammar" onclick="showPopup('grammar','${p}')">${p}</span>`); });
        vocabWords.forEach(w => { if (text.includes(w)) result = result.replace(new RegExp(w, 'g'), `<span class="highlight-vocab" onclick="showPopup('vocab','${w}')">${w}</span>`); });
        return result;
    }
    function showPopup(type, word) {
        let content = '';
        if (type === 'vocab') {
            const v = VOCAB.find(x => x.hanzi === word);
            if (v) content = `<h3 class="text-xl font-bold mb-2">${v.emoji} ${v.hanzi}</h3><p><strong>Pinyin:</strong> ${v.pinyin}</p><p><strong>Nghĩa:</strong> ${v.meaning}</p><p><strong>Ví dụ:</strong> ${v.example}</p>`;
        } else {
            const g = GRAMMAR.find(x => x.title.includes(word) || word.includes('越来越') && x.title.includes('越来越') || word.includes('除了') && x.title.includes('除了'));
            if (g) content = `<h3 class="text-xl font-bold mb-2">${g.title}</h3><p><strong>Công thức:</strong> ${g.formula}</p><p class="mt-2">${g.explain}</p>`;
        }
        if (!content) return;
        const overlay = document.createElement('div');
        overlay.className = 'popup-overlay';
        overlay.onclick = () => overlay.remove();
        overlay.innerHTML = `<div class="popup-content" onclick="event.stopPropagation()">${content}<button class="app-btn btn-primary mt-4 w-full" onclick="this.closest('.popup-overlay').remove()">Đóng</button></div>`;
        document.body.appendChild(overlay);
    }

            { q: '小明想买什么水果？', pinyin: 'Xiǎomíng xiǎng mǎi shénme shuǐguǒ?', options: ['火龙果和山竹', '苹果和香蕉', '西瓜和芒果'], answer: '火龙果和山竹' },
            { q: '火龙果一斤多少钱？', pinyin: 'Huǒlóngguǒ yì jīn duōshao qián?', options: ['八块', '十块', '六块'], answer: '八块' },
            { q: '山竹的味道怎么样？', pinyin: 'Shānzhú de wèidào zěnmeyàng?', options: ['酸酸甜甜的', '很苦', '很辣'], answer: '酸酸甜甜的' },
            { q: '小明一共花了多少钱？', pinyin: 'Xiǎomíng yígòng huā le duōshao qián?', options: ['二十四块', '二十块', '三十块'], answer: '二十四块' },
            { q: '小明买了几斤火龙果？', pinyin: 'Xiǎomíng mǎi le jǐ jīn huǒlóngguǒ?', options: ['两斤', '一斤', '三斤'], answer: '两斤' }
        ];
        container.innerHTML = '<div class="app-card p-4 mt-4"><h4 class="font-bold mb-3">📖 Đọc hiểu</h4>' +
            questions.map((q, i) => `<div class="mb-4"><p class="font-medium mb-1">${i + 1}. ${q.q}</p><p class="text-xs mb-2" style="color:var(--secondary);">${q.pinyin}</p>
            <div class="flex flex-wrap gap-2">${q.options.map(o => `<button class="app-btn text-sm py-2 px-3" style="background:var(--card);border:1px solid var(--border);" onclick="checkGrammar(this,'${o}','${q.answer}','dex-${i}')">${o}</button>`).join('')}</div>
            <div id="dex-${i}" class="mt-1 text-sm font-semibold"></div></div>`).join('') + '</div>';
    }

    // ===== SPEAKING =====
    function renderSpeaking() {
        const questions = ['这是什么水果？', '它是什么颜色？', '它是什么味道？', '你喜欢吃吗？为什么？'];
        document.getElementById('speaking-act1').innerHTML = questions.map((q, i) => `
            <div class="p-3 rounded-lg" style="background:var(--bg);">
                <p class="font-medium mb-2">${q}</p>
                <textarea rows="2" placeholder="Nhập câu trả lời bằng tiếng Trung..." class="text-sm"></textarea>
            </div>`).join('');
        // Fruit shop
        const shopFruits = VOCAB.slice(0, 8);
        document.getElementById('fruit-shop').innerHTML = shopFruits.map((v, i) => `
            <div class="app-card p-3 text-center cursor-pointer" onclick="addToCart(${i})">
                <div class="text-3xl mb-1">${v.emoji}</div>
                <div class="text-sm font-semibold">${v.hanzi}</div>
                <div class="text-xs" style="color:var(--secondary);">${(i + 5)}元/斤</div>
            </div>`).join('');
    }
    function addToCart(i) {
        const v = VOCAB[i]; const price = i + 5;
        cart.push({ name: v.hanzi, emoji: v.emoji, price });
        renderCart();
    }
    function renderCart() {
        document.getElementById('cart-items').innerHTML = cart.map((c, i) => `<div class="flex justify-between text-sm mb-1"><span>${c.emoji} ${c.name}</span><span>${c.price}元 <button onclick="cart.splice(${i},1);renderCart();" class="text-red-500 ml-1">✕</button></span></div>`).join('');
        const total = cart.reduce((s, c) => s + c.price, 0);
        document.getElementById('cart-total').textContent = cart.length ? `总共：${total}元` : '';
        if (cart.length > 0) generateShopDialogue(total);
    }
    function generateShopDialogue(total) {
        const items = cart.map(c => c.name).join('、');
        const d = `<h4 class="font-semibold mb-2">💬 Hội thoại mẫu:</h4>
            <p>👦: 老板，我要买${items}。</p>
            <p>👨: 好的，一共${total}块钱。</p>
            <p>👦: 给你${total}块。谢谢！</p>
            <p>👨: 谢谢光临！</p>`;
        const el = document.getElementById('generated-dialogue');
        el.innerHTML = d; el.classList.remove('hidden');
    }

    // Guess Fruit
    let guessFruitAnswer = null;
    function initGuessFruit() {
        const v = VOCAB[Math.floor(Math.random() * VOCAB.length)];
        guessFruitAnswer = v;
        document.getElementById('guess-fruit').innerHTML = `
            <div class="app-card p-4">
                <p class="mb-2">🎨 <strong>Màu sắc / 颜色:</strong> ${v.color} / ${v.color === 'vàng' ? '黄色' : '彩色'}</p>
                <p class="mb-2">📐 <strong>Hình dạng / 形状:</strong> ${v.shape} / ${v.shape === 'hình trụ' ? '圆柱形' : '形状'}</p>
                <p class="mb-2">👅 <strong>Mùi vị / 味道:</strong> ${v.taste} / ${v.taste === 'chua ngọt' ? '酸甜' : '味道'}</p>
                <p class="mb-3">🌸 <strong>Mùa / 季节:</strong> ${v.season} / ${v.season === 'hè' ? '夏天' : '季节'}</p>
                <input type="text" id="guess-input" placeholder="Nhập tên trái cây (tiếng Trung hoặc tiếng Việt)...">
                <button class="app-btn btn-primary mt-2 w-full" onclick="checkGuess()">Kiểm tra</button>
                <button class="app-btn btn-accent mt-2 w-full" onclick="initGuessFruit()">🔄 Câu mới</button>
                <div id="guess-result" class="mt-2 font-semibold"></div>
            </div>`;
    }
    function checkGuess() {
        const input = document.getElementById('guess-input').value.trim().toLowerCase();
        const correct = input === guessFruitAnswer.hanzi || input === guessFruitAnswer.meaning.toLowerCase() || input === guessFruitAnswer.pinyin.toLowerCase();
        playSound(correct);
        document.getElementById('guess-result').innerHTML = correct
            ? `<span style="color:#22c55e">🎉 Đúng rồi! ${guessFruitAnswer.emoji} ${guessFruitAnswer.hanzi} (${guessFruitAnswer.meaning})</span>`
            : `<span style="color:#ef4444">❌ Sai rồi! Đáp án: ${guessFruitAnswer.emoji} ${guessFruitAnswer.hanzi} (${guessFruitAnswer.meaning})</span>`;
        if (correct) launchConfetti();
    }

    // ===== GAMES =====
    function showGame(type) {
        const area = document.getElementById('game-area');
        if (type === 'bingo') renderBingo(area);
        else if (type === 'memory') renderMemory(area);
        else if (type === 'dragdrop') renderDragDrop(area);
        else if (type === 'speedquiz') renderSpeedQuiz(area);
    }

    function renderBingo(area) {
        const words = [...VOCAB].sort(() => Math.random() - 0.5).slice(0, 9);
        area.innerHTML = `<div class="app-card p-4"><h3 class="font-bold mb-3">🎯 Bingo</h3>
            <div class="grid grid-cols-3 gap-2 mb-4" id="bingo-grid">${words.map((w, i) => `<div class="bingo-cell" onclick="this.classList.toggle('selected')">${w.emoji}<br>${w.hanzi}</div>`).join('')}</div>
            <button class="app-btn btn-primary w-full" onclick="renderBingo(document.getElementById('game-area'))">🔄 Bảng mới</button></div>`;
    }

    function renderMemory(area) {
        const pairs = [...VOCAB].sort(() => Math.random() - 0.5).slice(0, 6);
        const cards = [...pairs.map(p => ({ id: p.hanzi, display: p.emoji, type: 'img' })), ...pairs.map(p => ({ id: p.hanzi, display: p.hanzi, type: 'text' }))].sort(() => Math.random() - 0.5);
        let flipped = [], matched = [];
        area.innerHTML = `<div class="app-card p-4"><h3 class="font-bold mb-3">🧠 Memory Game</h3>
            <div class="grid grid-cols-3 sm:grid-cols-4 gap-2" id="memory-grid">${cards.map((c, i) => `<div class="memory-card hidden-card" data-id="${c.id}" data-idx="${i}" onclick="memoryFlip(this)">?</div>`).join('')}</div></div>`;
        window._memoryCards = cards; window._memoryFlipped = []; window._memoryMatched = [];
    }
    function memoryFlip(el) {
        if (el.classList.contains('revealed') || el.classList.contains('matched') || window._memoryFlipped.length >= 2) return;
        const idx = parseInt(el.dataset.idx);
        const card = window._memoryCards[idx];
        el.textContent = card.display;
        el.classList.remove('hidden-card'); el.classList.add('revealed');
        window._memoryFlipped.push(el);
        if (window._memoryFlipped.length === 2) {
            const [a, b] = window._memoryFlipped;
            if (a.dataset.id === b.dataset.id) {
                a.classList.add('matched'); b.classList.add('matched');
                window._memoryMatched.push(a.dataset.id);
                playSound(true);
                if (window._memoryMatched.length === 6) { setTimeout(() => { launchConfetti(); showToast('🎉 Hoàn thành!', true); }, 500); }
            } else {
                playSound(false);
                setTimeout(() => { a.textContent = '?'; b.textContent = '?'; a.classList.remove('revealed'); a.classList.add('hidden-card'); b.classList.remove('revealed'); b.classList.add('hidden-card'); }, 800);
            }
            window._memoryFlipped = [];
        }
    }

    function renderDragDrop(area) {
        const items = [...VOCAB].sort(() => Math.random() - 0.5).slice(0, 5);
        const shuffledMeanings = [...items].sort(() => Math.random() - 0.5);
        area.innerHTML = `<div class="app-card p-4"><h3 class="font-bold mb-3">🔗 Ghép từ</h3>
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-2">${items.map(v => `<div class="drag-item text-center" draggable="true" data-meaning="${v.meaning}" ondragstart="dragStart(event)">${v.emoji} ${v.hanzi}</div>`).join('')}</div>
                <div class="space-y-2">${shuffledMeanings.map(v => `<div class="drag-item text-center text-sm drop-target" draggable="true" data-meaning="${v.meaning}" ondragover="allowDrop(event)" ondrop="dropMeaning(event)">${v.meaning}</div>`).join('')}</div>
            </div>
            <p class="text-sm mt-3" style="color:var(--text-muted);">Gợi ý: Kéo từ tiếng Trung vào nghĩa tương ứng để ghép cặp!</p></div>`;
    }
    let draggedMeaning = '';
    function dragStart(event) { draggedMeaning = event.currentTarget.dataset.meaning; event.dataTransfer.setData('text/plain', draggedMeaning); }
    function allowDrop(event) { event.preventDefault(); event.currentTarget.classList.add('over'); }
    function dropMeaning(event) { event.preventDefault(); const target = event.currentTarget; target.classList.remove('over'); const value = event.dataTransfer.getData('text/plain') || draggedMeaning; target.style.borderColor = value === target.dataset.meaning ? '#22c55e' : '#ef4444'; target.textContent = value === target.dataset.meaning ? '✅ ' + target.dataset.meaning : '❌ Thử lại'; }
    function checkDrag(sel, answer) {
        const result = sel.nextElementSibling;
        if (sel.value === answer) { result.textContent = '✅'; result.style.color = '#22c55e'; playSound(true); }
        else if (sel.value) { result.textContent = '❌'; result.style.color = '#ef4444'; playSound(false); }
    }

    // Speed Quiz
    function renderSpeedQuiz(area) {
        const questions = [...VOCAB].sort(() => Math.random() - 0.5).slice(0, 10).map(v => {
            const opts = [v.meaning, ...VOCAB.filter(x => x !== v).sort(() => Math.random() - 0.5).slice(0, 3).map(x => x.meaning)].sort(() => Math.random() - 0.5);
            return { q: `${v.emoji} ${v.hanzi} (${v.pinyin})`, answer: v.meaning, options: opts };
        });
        let current = 0, score = 0, timeLeft = 60;
        area.innerHTML = `<div class="app-card p-4"><h3 class="font-bold mb-3">⚡ Speed Quiz</h3>
            <div class="flex justify-between mb-3"><span id="sq-score">Điểm: 0/10</span><span id="sq-time" style="color:var(--secondary);font-weight:bold;">⏱ 60s</span></div>
            <div id="sq-question"></div></div>`;
        const timer = setInterval(() => {
            timeLeft--;
            document.getElementById('sq-time').textContent = `⏱ ${timeLeft}s`;
            if (timeLeft <= 0) { clearInterval(timer); endSpeedQuiz(score, questions.length); }
        }, 1000);
        window._sqTimer = timer;
        function showQ() {
            if (current >= questions.length) { clearInterval(timer); endSpeedQuiz(score, questions.length); return; }
            const q = questions[current];
            document.getElementById('sq-question').innerHTML = `<p class="text-xl font-bold text-center mb-4">${q.q}</p>
                <div class="grid grid-cols-2 gap-2">${q.options.map(o => `<button class="app-btn text-sm py-3" style="background:var(--card);border:2px solid var(--border);" onclick="sqAnswer(this,'${o.replace(/'/g, "\\'")}','${q.answer.replace(/'/g, "\\'")}')">${o}</button>`).join('')}</div>`;
        }
        window.sqAnswer = (btn, sel, ans) => {
            if (sel === ans) { score++; playSound(true); }
            else playSound(false);
            btn.style.background = sel === ans ? '#22c55e' : '#ef4444';
            btn.style.color = 'white';
            document.getElementById('sq-score').textContent = `Điểm: ${score}/${questions.length}`;
            current++;
            setTimeout(showQ, 500);
        };
        showQ();
    }
    function endSpeedQuiz(score, total) {
        if (window._sqTimer) clearInterval(window._sqTimer);
        document.getElementById('sq-question').innerHTML = `<div class="text-center"><p class="text-3xl font-bold mb-2">${score}/${total}</p><p class="text-lg">${score >= 8 ? '🎉 Xuất sắc!' : score >= 5 ? '👍 Khá tốt!' : '💪 Cố gắng hơn!'}</p>
            <button class="app-btn btn-primary mt-4" onclick="renderSpeedQuiz(document.getElementById('game-area'))">🔄 Chơi lại</button></div>`;
        if (score >= 8) launchConfetti();
    }

    // ===== FINAL TEST =====
    function renderTest() {
        const area = document.getElementById('test-area');
        const allQ = [];
        // Multiple choice
        VOCAB.slice(0, 5).forEach(v => {
            const opts = [v.meaning, ...VOCAB.filter(x => x !== v).sort(() => Math.random() - 0.5).slice(0, 3).map(x => x.meaning)].sort(() => Math.random() - 0.5);
            allQ.push({ type: 'mc', q: `"${v.hanzi}" có nghĩa là gì?`, options: opts, answer: v.meaning });
        });
        // Fill in
        GRAMMAR.forEach(g => {
            const ex = g.exercises[0];
            allQ.push({ type: 'mc', q: ex.q, options: ex.options, answer: ex.answer });
        });
        // Order
        allQ.push({ type: 'mc', q: '小明在哪里买水果？', options: ['水果店', '超市', '网上', '学校'], answer: '水果店' });
        allQ.push({ type: 'mc', q: '山竹的味道是什么？', options: ['酸酸甜甜的', '很苦', '很辣', '很咸'], answer: '酸酸甜甜的' });

        const shuffled = allQ.sort(() => Math.random() - 0.5).slice(0, 10);
        let answered = 0, correct = 0;
        const startTime = Date.now();

        area.innerHTML = `<div class="app-card p-4"><h3 class="font-bold mb-3">📋 Kiểm tra cuối bài (10 câu)</h3>
            <div id="test-questions">${shuffled.map((q, i) => `
                <div class="mb-4 p-3 rounded-lg" style="background:var(--bg);">
                    <p class="font-medium mb-2">${i + 1}. ${q.q}</p>
                    <div class="flex flex-wrap gap-2">${q.options.map(o => `<button class="app-btn text-sm py-2 px-3" style="background:var(--card);border:1px solid var(--border);" onclick="testAnswer(this,'${o.replace(/'/g, "\\'")}','${q.answer.replace(/'/g, "\\'")}',${i})">${o}</button>`).join('')}</div>
                    <div id="test-r-${i}" class="mt-1 text-sm font-semibold"></div>
                </div>`).join('')}</div>
            <div id="test-result" class="hidden mt-4 text-center app-card p-6"></div></div>`;

        window.testAnswer = (btn, sel, ans, idx) => {
            if (document.getElementById(`test-r-${idx}`).textContent) return;
            const isCorrect = sel === ans;
            if (isCorrect) correct++;
            answered++;
            playSound(isCorrect);
            document.getElementById(`test-r-${idx}`).innerHTML = isCorrect ? '<span style="color:#22c55e">✅ Đúng!</span>' : `<span style="color:#ef4444">❌ Đáp án: ${ans}</span>`;
            btn.style.background = isCorrect ? '#22c55e' : '#ef4444'; btn.style.color = 'white';
            if (answered === shuffled.length) {
                const time = Math.round((Date.now() - startTime) / 1000);
                const pct = Math.round(correct / shuffled.length * 100);
                const grade = pct >= 90 ? 'A - Xuất sắc' : pct >= 70 ? 'B - Khá' : pct >= 50 ? 'C - Trung bình' : 'D - Cần cố gắng';
                const el = document.getElementById('test-result');
                el.classList.remove('hidden');
                el.innerHTML = `<h3 class="text-2xl font-bold mb-2">🏆 Kết quả</h3>
                    <p class="text-4xl font-bold" style="color:var(--primary);">${correct}/${shuffled.length}</p>
                    <p class="mt-2">Tỷ lệ đúng: ${pct}%</p>
                    <p>Thời gian: ${time}s</p>
                    <p class="text-lg font-bold mt-2" style="color:var(--secondary);">${grade}</p>
                    <button class="app-btn btn-primary mt-4" onclick="renderTest()">🔄 Làm lại</button>`;
                if (pct >= 70) launchConfetti();
                progress.test = true; updateProgress();
            }
        };
    }

    // Init test on section show
    const origShow = showSection;
    showSection = function(id) {
        origShow(id);
        if (id === 'test') renderTest();
        if (id === 'vocab') { progress.vocab = true; updateProgress(); }
        if (id === 'grammar') { progress.grammar = true; updateProgress(); }
        if (id === 'dialogue') { progress.dialogue = true; updateProgress(); }
        if (id === 'phrases') { progress.dialogue = true; updateProgress(); }
        if (id === 'speaking') { progress.speaking = true; updateProgress(); }
        if (id === 'games') { progress.games = true; updateProgress(); }
    };
    </script>
 </body>
